<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gr-whiteboard</title>
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  #notice { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font: 16px/1.5 system-ui, sans-serif; padding: 16px; text-align: center; background: #fff; color: #1e1e1e; z-index: 10; }
  .wbc-status { font: 12px/1.4 system-ui, sans-serif; padding: 4px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.9); color: #1e1e1e; border: 1px solid #ddd; white-space: nowrap; }
  .wbc-status.off { background: #fff3bf; }
  .wbc-bar { display: flex; gap: 6px; align-items: center; }
  .wbc-signal { font: 600 13px/1.4 system-ui, sans-serif; padding: 4px 10px; border-radius: 6px; white-space: nowrap; color: #1e1e1e; }
  .wbc-reading { background: #ffec99; }
  .wbc-working { background: #a5d8ff; }
  .wbc-waiting { background: #b2f2bb; }
  .wbc-send { font: 600 13px/1.4 system-ui, sans-serif; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #ced4da; background: #f1f3f5; color: #495057; white-space: nowrap; }
  .wbc-send.wbc-has { background: #1971c2; border-color: #1971c2; color: #fff; }
  .wbc-auto { font: 12px/1.4 system-ui, sans-serif; display: flex; align-items: center; gap: 2px; color: #495057;
    background: rgba(255, 255, 255, 0.9); padding: 3px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .wbc-join-dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center;
    justify-content: center; z-index: 20; }
  .wbc-join-box { background: #fff; color: #1e1e1e; border-radius: 10px; padding: 16px 20px; max-width: 90vw; max-height: 90vh;
    overflow: auto; font: 14px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .wbc-join-url { font: 12px/1.4 ui-monospace, monospace; word-break: break-all; user-select: all; text-align: center; }
  .wbc-join-box canvas { image-rendering: pixelated; }
  .wbc-join-ca { border-top: 1px solid #dee2e6; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .wbc-join-ca ol { margin: 0; padding-left: 20px; }
  .wbc-idle { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 15; max-width: 90vw;
    font: 600 14px/1.4 system-ui, sans-serif; background: #fff3bf; color: #1e1e1e; border: 1px solid #f08c00;
    border-radius: 8px; padding: 8px 14px; }
</style>
